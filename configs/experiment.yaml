project:
  name: fruit-freshness-edge-ai-study
  version: 0.2.0
  task: multi-fruit-quality-classification
  status: baseline_training_completed_validation_analysis_completed

reproducibility:
  random_seed: 20261119
  deterministic: true
  split_seed: 20261119
  split_strategy: group_aware_stratified
  split_ratios:
    train: 0.70
    validation: 0.15
    test: 0.15
  test_split_sealed: true
  test_split_accessed: false

data:
  dataset_id: two_reconciled_fruit_grade_datasets
  total_records: 6908
  unique_sha256_images: 4862
  duplicate_aware_groups: 4765
  num_classes: 21
  image_size: 224
  prevent_duplicate_leakage: true
  preserve_original_images: true
